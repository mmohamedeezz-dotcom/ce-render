name: brain
# العقل المدبر: لينك فيديو طويل -> ريلز. التنزيل على جهاز المكتب (self-hosted)، والباقي على ماكينات GitHub.
on:
  repository_dispatch:
    types: [brain]
  workflow_dispatch:
    inputs:
      url: {description: 'YouTube URL', required: true}
      n: {description: 'عدد الريلز', default: '10'}
      job: {description: 'job id', default: 'manual'}
permissions:
  contents: write
env:
  URL: ${{ github.event.client_payload.url || inputs.url }}
  CE_N: ${{ github.event.client_payload.n || inputs.n || '10' }}
  CE_GUIDE: ${{ github.event.client_payload.guide }}
  JOB: ${{ github.event.client_payload.job || inputs.job || 'manual' }}
jobs:
  audio:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: tools
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $t = "$env:USERPROFILE\ce-tools"
          New-Item -ItemType Directory -Force $t | Out-Null
          if (!(Test-Path "$t\yt-dlp.exe")) { Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$t\yt-dlp.exe" }
          if (!(Test-Path "$t\ffmpeg.exe")) {
            Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip -OutFile "$t\ff.zip"
            Expand-Archive "$t\ff.zip" "$t\ff" -Force
            Copy-Item "$t\ff\*\bin\ff*.exe" $t
            Remove-Item "$t\ff.zip"
          }
          if (!(Test-Path "$t\deno.exe")) {
            Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile "$t\deno.zip"
            Expand-Archive "$t\deno.zip" $t -Force
            Remove-Item "$t\deno.zip"
          }
          & "$t\yt-dlp.exe" -U
          $t | Out-File -Append $env:GITHUB_PATH -Encoding utf8
      - name: audio only
        shell: powershell
        run: |
          Remove-Item -Recurse -Force audio.*, clips, brain -ErrorAction SilentlyContinue
          yt-dlp -f "ba/b" -x --audio-format mp3 --audio-quality 64K --postprocessor-args "ffmpeg:-ac 1 -ar 16000" --no-playlist -o "audio.%(ext)s" "$env:URL"
          if (!(Test-Path audio.mp3)) { throw "audio download failed" }
      - uses: actions/upload-artifact@v4
        with: {name: audio, path: audio.mp3, retention-days: 1}

  pick:
    needs: audio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: audio}
      - name: transcribe + shortlist
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip -q install requests
          mkdir -p brain
          python brain.py transcribe audio.mp3 brain/transcript.json
          python brain.py pick brain/transcript.json brain/cands.json
      - uses: actions/upload-artifact@v4
        with: {name: brain, path: brain, retention-days: 1}

  clips:
    needs: pick
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - shell: powershell
        run: |
          Remove-Item -Recurse -Force clips, brain -ErrorAction SilentlyContinue
          "$env:USERPROFILE\ce-tools" | Out-File -Append $env:GITHUB_PATH -Encoding utf8
      - uses: actions/download-artifact@v4
        with: {name: brain, path: brain}
      - name: download only the shortlisted parts
        shell: powershell
        run: |
          $c = Get-Content brain\cands.json -Raw -Encoding UTF8 | ConvertFrom-Json
          New-Item -ItemType Directory -Force clips | Out-Null
          $inv = [cultureinfo]::InvariantCulture
          $procs = @()
          foreach ($x in $c) {
            $sec = [string]::Format($inv, "*{0}-{1}", $x.start, $x.end)
            $a = @('-f', '"bv*[height<=1080][vcodec^=avc1]+ba/bv*[height<=1080]+ba/b"', '--download-sections', "`"$sec`"",
                   '--force-keyframes-at-cuts', '--merge-output-format', 'mp4', '--no-playlist', '-o', "`"clips/c$($x.id).%(ext)s`"", "`"$env:URL`"")
            $procs += Start-Process -FilePath yt-dlp.exe -ArgumentList $a -NoNewWindow -PassThru
            if ($procs.Count % 4 -eq 0) { $procs | Wait-Process -ErrorAction SilentlyContinue }
          }
          $procs | Wait-Process -ErrorAction SilentlyContinue
          Get-ChildItem clips | Format-Table Name, Length
          if (!(Get-ChildItem clips\*.mp4)) { throw "no clips downloaded" }
      - uses: actions/upload-artifact@v4
        with: {name: clips, path: clips/*.mp4, retention-days: 1}

  judge:
    needs: clips
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ids: ${{ steps.j.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: brain, path: brain}
      - uses: actions/download-artifact@v4
        with: {name: clips, path: clips}
      - id: j
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip -q install requests
          python brain.py judge brain/cands.json clips brain/picks.json
          echo "ids=$(python brain.py split brain/transcript.json brain/picks.json picks)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: picks, path: picks, retention-days: 1}

  render:
    needs: judge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.judge.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: picks, path: picks}
      - uses: actions/download-artifact@v4
        with: {name: clips, path: clips}
      - run: |
          pip -q install opencv-python-headless numpy
          mkdir -p out
          python brain.py render clips/c${{ matrix.id }}.mp4 picks/p${{ matrix.id }}.json out/reel_${{ matrix.id }}.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ matrix.id }}
          path: out
          retention-days: 1

  publish:
    needs: [judge, render]
    if: always() && needs.judge.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: reel-*, path: out, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: picks, path: picks}
      - run: |
          cd out
          python3 - <<'PY'
          import json, glob, os
          reels = []
          for f in sorted(glob.glob('../picks/p*.json')):
              p = json.load(open(f)); i = p['id']
              if not os.path.exists(f'reel_{i}.mp4'): continue
              qa = json.load(open(f'reel_{i}.json')) if os.path.exists(f'reel_{i}.json') else {}
              reels.append({'id': i, 'file': f'reel_{i}.mp4', 'hook': p['hook'], 'start': p['start'], 'end': p['end'],
                            'why': p.get('why', ''), 'note': p.get('note', ''), 'text': p.get('text', ''), 'qa': qa})
          json.dump({'job': os.environ['JOB'], 'url': os.environ['URL'], 'run': os.environ['GITHUB_RUN_ID'], 'reels': reels},
                    open('result.json', 'w'), ensure_ascii=False, indent=1)
          print(len(reels), 'reels')
          PY
          rm -f *.cmd *.ass reel_*.json
          git init -q -b "br-${GITHUB_RUN_ID}"
          git config user.name ce-bot && git config user.email ce-bot@users.noreply.github.com
          git add -A && git commit -qm "brain ${JOB}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "br-${GITHUB_RUN_ID}"
