name: render
on:
  repository_dispatch:
    types: [render]
permissions:
  contents: write
concurrency:
  group: render-${{ github.event.client_payload.job }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright onnxruntime opencv-python-headless numpy
          python -m playwright install --with-deps chromium
      - name: Spec
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json, os
          p = json.loads(os.environ['PAYLOAD'])
          json.dump(p['spec'], open('spec.json', 'w', encoding='utf-8'), ensure_ascii=False)
          open('job.txt', 'w').write(''.join(c for c in p['job'] if c.isalnum()))
          PY
      - uses: actions/cache@v4
        with:
          path: cache
          key: ce-cache-${{ github.run_id }}
          restore-keys: ce-cache-
      - name: Agent pre-pass (reels)
        if: github.event.client_payload.spec.kind == 'reel'
        continue-on-error: true
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "no ANTHROPIC_API_KEY, agent skipped"; exit 0; }
          npm i -g @anthropic-ai/claude-code >/dev/null 2>&1
          CODE=$(python -c "import json;s=json.load(open('spec.json',encoding='utf-8'));print(''.join(c for c in str(s.get('code') or 'asset') if c.isalnum() or c in '-_') or 'asset')")
          mkdir -p out
          python -c "import json;open('design.html','w',encoding='utf-8').write(json.load(open('spec.json',encoding='utf-8'))['html'])"
          python reel_look.py > /dev/null 2>&1 && cp preview/sheet.jpg "out/${CODE}_sheet_before.jpg" || true
          # the agent's own words never go to the public log: only cost and turns are printed
          timeout 1000 claude -p "Finish the reel. Follow AGENT_REEL.md exactly." \
            --append-system-prompt "$(cat AGENT_REEL.md)" \
            --model claude-sonnet-5-5 --permission-mode dontAsk \
            --allowedTools "Read" "Edit(design.html)" "Bash(python reel_look.py)" \
            --max-budget-usd 3 --output-format json > agent.json 2> agent.err || true
          python - <<'PY'
          import json, re
          try:
              r = json.load(open('agent.json', encoding='utf-8'))
          except Exception:
              r = {}
          print('agent:', r.get('subtype'), 'turns', r.get('num_turns'), 'cost', r.get('total_cost_usd'))
          spec = json.load(open('spec.json', encoding='utf-8'))
          new = open('design.html', encoding='utf-8').read()
          count = lambda h: (len(re.findall(r'<section[^>]*class="[^"]*\bscene\b', h)), len(re.findall(r'data-vo=', h)))
          if count(new) == count(spec['html']) and count(new)[0] > 0:
              spec['html'] = new
              json.dump(spec, open('spec.json', 'w', encoding='utf-8'), ensure_ascii=False)
              print('agent changes kept')
          else:
              print('agent changed the scene count, original kept')
          code = ''.join(c for c in str(spec.get('code') or 'asset') if c.isalnum() or c in '-_') or 'asset'
          open(f'out/{code}_agent.txt', 'w', encoding='utf-8').write(str(r.get('result') or '')[:3000])
          PY
          python reel_look.py > /dev/null 2>&1 && cp preview/sheet.jpg "out/${CODE}_sheet_after.jpg" || true
      - name: Render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CE_PRO: ${{ github.event.client_payload.spec.kind == 'post' && '1' || '' }}
        run: python render.py spec.json out
      - name: Agent finish (designs)
        if: github.event.client_payload.spec.kind == 'post'
        continue-on-error: true
        timeout-minutes: 25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CE_PRO: '1'
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "no ANTHROPIC_API_KEY, agent skipped"; exit 0; }
          npm i -g @anthropic-ai/claude-code >/dev/null 2>&1
          CODE=$(python -c "import json;s=json.load(open('spec.json',encoding='utf-8'));print(''.join(c for c in str(s.get('code') or 'asset') if c.isalnum() or c in '-_') or 'asset')")
          python -c "import json;open('design.html','w',encoding='utf-8').write(json.load(open('spec.json',encoding='utf-8'))['html'])"
          cp "out/$CODE.png" "out/${CODE}_before.png"
          # the agent's own words never go to the public log: only cost and turns are printed
          timeout 1200 claude -p "Finish the design. Follow AGENT_DESIGN.md exactly. The design code is $CODE, so the render is out/$CODE.png." \
            --append-system-prompt "$(cat AGENT_DESIGN.md)" \
            --model claude-sonnet-5-5 --permission-mode dontAsk \
            --allowedTools "Read" "Edit(design.html)" "Write(design.html)" "Bash(python look.py)" \
            --max-budget-usd 2 --output-format json > agent.json 2> agent.err || true
          python - <<'PY'
          import json, os
          code = os.environ.get('CODE') or ''
          try:
              r = json.load(open('agent.json', encoding='utf-8'))
          except Exception:
              r = {}
          print('agent:', r.get('subtype'), 'turns', r.get('num_turns'), 'cost', r.get('total_cost_usd'))
          PY
          python -c "import json;r=json.load(open('agent.json',encoding='utf-8'));open('out/${CODE}_agent.txt','w',encoding='utf-8').write(str(r.get('result') or '')[:3000])" || true
          [ -s "out/$CODE.png" ] || cp "out/${CODE}_before.png" "out/$CODE.png"
      - name: Publish
        id: pub
        run: |
          JOB=$(cat job.txt)
          git config user.name "ce-render" && git config user.email "ce-render@users.noreply.github.com"
          # one small branch per render: the CDN refuses repo versions over 50 MB, so renders must not pile up in one branch
          git checkout -q --orphan m-$JOB
          git rm -rfq --cached . >/dev/null 2>&1 || true
          mkdir -p v/$JOB && cp out/* v/$JOB/
          git add -f v && git commit -qm "render $JOB" && git push -q origin m-$JOB
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "files=$(ls out | tr '\n' ',')" >> $GITHUB_OUTPUT
      - name: Callback
        if: always()
        env:
          CB: ${{ github.event.client_payload.callback }}
          TOKEN: ${{ github.event.client_payload.token }}
          JOBID: ${{ github.event.client_payload.job }}
          BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.pub.outputs.sha }}/v
          FILES: ${{ steps.pub.outputs.files }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          job = ''.join(c for c in os.environ['JOBID'] if c.isalnum())
          body = {'action': 'render_done', 'job': os.environ['JOBID'], 'token': os.environ['TOKEN'], 'status': os.environ['STATUS'],
                  'base': os.environ['BASE'] + '/' + job, 'files': [f for f in os.environ.get('FILES', '').split(',') if f]}
          req = urllib.request.Request(os.environ['CB'], data=json.dumps(body).encode(), headers={'Content-Type': 'application/json'})
          print(urllib.request.urlopen(req, timeout=60).status)
          PY
